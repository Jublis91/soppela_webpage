<!doctype html>
<html lang="fi"> <!-- Vaihdettu suomen kielelle -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Emma Nikander</title>
    
    <!-- Favicon (päivitä tarvittaessa) -->
    <link rel="icon" type="image/png" href="/vite.svg" />

    <!-- Perusmeta-kuvaus hakukoneita varten -->
    <meta name="description" content="Soppela – Portfolio, blogi ja kirjaprojekti maatilaelämästä" />
    
    <!-- Open Graph -meta Facebookia, Twitteriä jne. varten -->
    <meta property="og:title" content="Soppela" />
    <meta property="og:description" content="Portfolio, blogi ja kirjaprojekti maatilaelämästä." />
    <meta property="og:image" content="/images/og-image.jpg" /> <!-- Varmista, että kuva on olemassa -->
    <meta property="og:url" content="https://soppela.fi" /> <!-- Muokkaa URL oikeaksi -->
    <meta property="og:type" content="website" />

    <!-- Twitter Card (jos halutaan parempi Twitter-jako) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Soppela" />
    <meta name="twitter:description" content="Portfolio, blogi ja kirjaprojekti maatilaelämästä." />
    <meta name="twitter:image" content="/images/og-image.jpg" />

    <!-- CSS-tiedosto -->
    <link rel="stylesheet" href="/src/styles.css" />

    <!-- Mahdollinen fontti (esim. Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  </head>
  
  <body>
    <div id="root"></div>

    <!-- JavaScript-sovelluksen käynnistys -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

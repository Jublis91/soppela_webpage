version: "3.9"
services:
  soppela_dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: soppela_dev
    ports:
      - "5173:5173"
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
      - ./public:/app/public:ro   
    environment:
      - NODE_ENV=development
    networks:
      - soppela_net

  soppela_prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: soppela_prod
    ports:
      - "3001:3001"
    restart: unless-stopped
    volumes:
      - ./secure:/app/secure:ro
      - ./public:/app/public:ro   
    environment:
      - NODE_ENV=production
    networks:
      - soppela_net

networks:
  soppela_net:
    driver: bridge
